# Efflab Agent Kit 通用 Host Runtime 骨架；不得链接 sidecar 库或 grok shell。
[package]
name = "efflab-agent-host"
version = "0.1.0"
description = "Embeddable Efflab Agent Kit Host Runtime"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
efflab-agent-contract = { path = "../efflab-agent-contract" }
efflab-agent-platform = { path = "../efflab-agent-platform" }
libc = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xai-tty-utils = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Windows 定向硬化测试直接调用文件系统 API，必须声明直接测试依赖。
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
